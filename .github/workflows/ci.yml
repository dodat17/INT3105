name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movie_booking
          POSTGRES_PASSWORD: movie_booking
          POSTGRES_DB: movie_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movie_booking -d movie_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check app tests
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov=app --cov-report=term-missing
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://movie_booking:movie_booking@localhost:5432/movie_booking_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cinema-booking"
version = "0.1.0"
description = "Layered REST API for cinema ticket booking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.1,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyjwt>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "import-linter>=2.1,<3",
  "locust>=2.32,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cinema_booking"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"load_tests/locustfile.py" = ["F401"]

openapi: 3.1.0
info:
  title: Movie Booking
  description: 'Hợp đồng API cho dịch vụ đặt vé xem phim, đối chiếu mục 6 của requirements.md.


    **Xác nhận đặt vé là mô phỏng.** `POST /api/v1/bookings/{bookingId}/confirm` không
    thực hiện

    thanh toán và không được hiểu là "thanh toán thành công".


    Mọi mốc thời gian lưu ở UTC và trả ở ISO 8601 có timezone. Giá trị tiền là số
    nguyên VND.

    Mọi lỗi JSON có dạng `{"error": {"code", "message", "requestId", "details?"}}`.

    Endpoint dưới `/api/v1/admin/` yêu cầu token của tài khoản ADMIN.

    '
  version: 0.1.0
paths:
  /health/live:
    get:

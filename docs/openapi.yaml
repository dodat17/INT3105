      operationId: update_showtime_api_v1_admin_showtimes__showtime_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: showtime_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Showtime Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowtimeUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowtimeResponse'
        '409':
          description: Xung đột nghiệp vụ, xem error.code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 'VALIDATION_ERROR: dữ liệu không hợp lệ'
          content:
            application/json:
              schema: *id001
        '413':
          description: 'PAYLOAD_TOO_LARGE: body vượt 64 KB'
          content:
            application/json:
              schema: *id001
        '415':
          description: 'UNSUPPORTED_MEDIA_TYPE: body không phải JSON'
          content:
            application/json:
              schema: *id001
        '401':
          description: 'UNAUTHENTICATED: thiếu hoặc sai token'
          content:
            application/json:
              schema: *id001
        '403':
          description: 'FORBIDDEN: yêu cầu vai trò ADMIN'
          content:
            application/json:
              schema: *id001
        '404':
          description: RESOURCE_NOT_FOUND
          content:
            application/json:
              schema: *id001
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema: *id001
    delete:
      tags:
      - admin
      summary: Xóa suất chiếu (ADMIN)
      operationId: delete_showtime_api_v1_admin_showtimes__showtime_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: showtime_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Showtime Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: 'VALIDATION_ERROR: dữ liệu không hợp lệ'
          content:
            application/json:
              schema: *id001
        '401':
          description: 'UNAUTHENTICATED: thiếu hoặc sai token'
          content:
            application/json:
              schema: *id001
        '403':
          description: 'FORBIDDEN: yêu cầu vai trò ADMIN'
          content:
            application/json:
              schema: *id001
        '404':
          description: RESOURCE_NOT_FOUND
          content:
            application/json:
              schema: *id001
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema: *id001
components:
